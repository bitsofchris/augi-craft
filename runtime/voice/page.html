<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Talk to Augi</title>
<style>
  :root { --bg: #1d2b1f; --card: #2f4a32; --text: #f4f1e6; --muted: #b9c4b0; --hot: #e8a33d; --ok: #7fd17f; --bad: #ff8a7a; }
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 18px/1.4 system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 26px; margin: 4px 0 12px; }
  #who { color: var(--muted); font-size: 15px; }
  #who select { font-size: 16px; }
  #bots { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 12px 0; }
  .bot { border: 0; border-radius: 18px; padding: 22px 12px; background: var(--card); color: var(--text); font: 600 22px system-ui, sans-serif; touch-action: none; }
  .bot small { display: block; font-weight: 400; font-size: 14px; color: var(--muted); margin-top: 4px; }
  .bot.off { opacity: .45; }
  .bot.rec { background: var(--hot); color: #221; transform: scale(1.04); }
  .bot.rec small { color: #332; }
  #status { min-height: 56px; font-size: 20px; padding: 8px 4px; }
  #status.ok { color: var(--ok); } #status.bad { color: var(--bad); }
  #feed { list-style: none; padding: 0; margin: 0; font-size: 16px; }
  #feed li { padding: 8px 10px; border-radius: 10px; background: #263a28; margin-bottom: 6px; }
  #feed b { color: var(--hot); }
  label { color: var(--muted); font-size: 15px; display: inline-flex; gap: 6px; align-items: center; }
  [hidden] { display: none !important; }
  #start { position: fixed; inset: 0; background: var(--bg); border: 0; color: var(--text); font: 700 30px system-ui, sans-serif; width: 100%; }
</style>
</head>
<body>
<button id="start">Tap to start talking to the bots</button>
<main>
  <h1>Hold a bot's button and talk</h1>
  <div id="who"></div>
  <div id="bots"></div>
  <div id="status">Let go when you finish talking.</div>
  <label><input type="checkbox" id="speak" checked> Read bot replies out loud</label>
  <label id="saveRow" hidden><input type="checkbox" id="save"> Save recordings (for a video)</label>
  <h2 style="font-size:18px">What's happening</h2>
  <ul id="feed"></ul>
</main>
<script>
const $ = id => document.getElementById(id)
const params = new URLSearchParams(location.search)
let player = null, ctx = null, source = null, node = null, chunks = null, busy = false

function status (text, kind = '') { $('status').textContent = text; $('status').className = kind }
function feed (html) {
  const li = document.createElement('li'); li.innerHTML = html
  $('feed').prepend(li)
  while ($('feed').children.length > 30) $('feed').lastChild.remove()
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

async function loadConfig () {
  const cfg = await (await fetch('api/config')).json()
  player ??= cfg.players.includes(params.get('player')) ? params.get('player') : cfg.players[0]
  $('who').innerHTML = 'Talking as <select id="player"></select>'
  for (const p of cfg.players) $('player').add(new Option(p, p, false, p === player))
  $('player').onchange = e => { player = e.target.value }
  $('saveRow').hidden = !cfg.canSave
  const targets = [...cfg.targets, { name: 'everyone', role: 'all the bots' }]
  $('bots').innerHTML = ''
  for (const t of targets) {
    const b = document.createElement('button')
    b.className = 'bot' + (t.online === false ? ' off' : '')
    b.innerHTML = `${esc(t.name)}<small>${esc(t.role ?? '')}${t.online === false ? ' (not playing)' : ''}</small>`
    b.addEventListener('pointerdown', e => { e.preventDefault(); b.setPointerCapture(e.pointerId); begin(b) })
    b.addEventListener('pointerup', () => finish(b, t.name))
    b.addEventListener('pointercancel', () => finish(b, null))
    b.addEventListener('contextmenu', e => e.preventDefault())
    $('bots').append(b)
  }
}

// Collect raw microphone samples while a button is held.
const WORKLET = `registerProcessor('tap', class extends AudioWorkletProcessor {
  process (inputs) { const ch = inputs[0][0]; if (ch) this.port.postMessage(ch.slice(0)); return true }
})`
async function setup () {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } })
  ctx = new AudioContext()
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: 'text/javascript' })))
  source = ctx.createMediaStreamSource(stream)
  node = new AudioWorkletNode(ctx, 'tap')
  node.port.onmessage = e => { if (chunks) chunks.push(e.data) }
  source.connect(node)
}

function begin (button) {
  if (busy || !ctx) return
  ctx.resume()
  chunks = []
  button.classList.add('rec')
  status('Listening...')
}

async function finish (button, target) {
  button.classList.remove('rec')
  if (!chunks) return
  const recorded = chunks; chunks = null
  const seconds = recorded.reduce((n, c) => n + c.length, 0) / ctx.sampleRate
  if (!target) return status('Cancelled.')
  if (seconds < 0.4) return status('Hold the button down while you talk.', 'bad')
  busy = true
  status('Thinking...')
  try {
    const wav = encodeWav(downsample(recorded, ctx.sampleRate, 16000), 16000)
    const save = $('save').checked && !$('saveRow').hidden ? '&save=1' : ''
    const res = await fetch(`api/talk?target=${encodeURIComponent(target)}&player=${encodeURIComponent(player)}${save}`, { method: 'POST', headers: { 'content-type': 'audio/wav' }, body: wav })
    const out = await res.json()
    const kept = out.saved ? ' (saved)' : ''
    if (out.ok) status(`Sent to ${target}: "${out.text}"${kept}`, 'ok')
    else status(out.error + kept, 'bad')
  } catch (err) {
    status('Could not reach the bots: ' + err.message, 'bad')
  } finally { busy = false }
}

function downsample (chunks, from, to) {
  const total = chunks.reduce((n, c) => n + c.length, 0)
  const input = new Float32Array(total)
  let o = 0; for (const c of chunks) { input.set(c, o); o += c.length }
  const ratio = from / to, out = new Float32Array(Math.floor(total / ratio))
  for (let i = 0; i < out.length; i++) {
    const start = Math.floor(i * ratio), end = Math.min(total, Math.floor((i + 1) * ratio))
    let sum = 0; for (let j = start; j < end; j++) sum += input[j]
    out[i] = sum / Math.max(1, end - start)
  }
  return out.subarray(0, Math.min(out.length, to * 15)) // 15 s cap
}

function encodeWav (samples, rate) {
  const buf = new ArrayBuffer(44 + samples.length * 2), v = new DataView(buf)
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)) }
  str(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); str(8, 'WAVE'); str(12, 'fmt ')
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true)
  v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, 'data')
  v.setUint32(40, samples.length * 2, true)
  for (let i = 0; i < samples.length; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, samples[i])) * 0x7fff, true)
  return new Blob([buf], { type: 'audio/wav' })
}

function listen () {
  const events = new EventSource('api/events')
  events.onmessage = e => {
    const ev = JSON.parse(e.data)
    if (ev.type === 'heard') feed(`<b>${esc(ev.player)}</b> to ${esc(ev.target)}: ${esc(ev.text)}`)
    if (ev.type === 'reply') {
      feed(`<b>${esc(ev.username)}</b>: ${esc(ev.message)}`)
      if ($('speak').checked && 'speechSynthesis' in window) speechSynthesis.speak(new SpeechSynthesisUtterance(`${ev.username.replace(/^Augi/i, 'Augi ')} says ${ev.message}`))
    }
  }
}

// Remember the save toggle on this tablet; the page works the same without storage.
try { $('save').checked = localStorage.getItem('augi-save') === '1' } catch {}
$('save').onchange = e => { try { localStorage.setItem('augi-save', e.target.checked ? '1' : '0') } catch {} }

$('start').addEventListener('click', async () => {
  try {
    await setup()
    $('start').remove()
    await loadConfig()
    listen()
    setInterval(() => { if (!chunks && !busy) loadConfig() }, 60000) // refresh who is playing
  } catch (err) {
    $('start').textContent = window.isSecureContext ? `Microphone blocked: ${err.message}` : 'This page needs https to use the microphone.'
  }
})
</script>
</body>
</html>
